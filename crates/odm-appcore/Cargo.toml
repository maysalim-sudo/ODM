[package]
name = "odm-appcore"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
odm-core.workspace = true
odm-store.workspace = true
odm-engine.workspace = true
odm-torrent.workspace = true
bytes.workspace = true
serde.workspace = true
reqwest.workspace = true
uuid.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
sha2.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Power"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
odm-testserver.workspace = true
axum.workspace = true
tempfile.workspace = true
