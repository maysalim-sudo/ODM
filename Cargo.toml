[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
odm-core = { path = "crates/odm-core" }
odm-store = { path = "crates/odm-store" }
odm-engine = { path = "crates/odm-engine" }
odm-testserver = { path = "crates/odm-testserver" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fastrand = "2"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
axum = "0.8"
bytes = "1"
sha2 = "0.10"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
