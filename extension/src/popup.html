<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ODM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>ODM</h1>
    <p id="status" class="muted">Connecting...</p>
    <p id="summary"></p>
    <div id="permission" hidden>
      <p>ODM needs access to all sites to read download cookies.</p>
      <button id="allow" type="button">Allow</button>
    </div>
    <div id="problem" hidden>
      <p id="problem-text"></p>
      <button id="dismiss" type="button">Dismiss</button>
    </div>
    <section id="detection">
      <h2>Video detection</h2>
      <label class="switch" id="detect-site-row" hidden>
        <span id="detect-site-label">On this site</span>
        <input type="checkbox" role="switch" id="detect-site" />
        <span class="track" aria-hidden="true"></span>
        <span class="state" id="detect-site-state">On</span>
      </label>
      <label class="switch">
        <span>On all sites</span>
        <input type="checkbox" role="switch" id="detect-all" />
        <span class="track" aria-hidden="true"></span>
        <span class="state" id="detect-all-state">On</span>
      </label>
      <details id="detect-off-sites" hidden>
        <summary id="detect-off-summary"></summary>
        <ul id="detect-off-list"></ul>
      </details>
    </section>
    <p id="detection-off" class="muted" hidden></p>
    <section id="videos" hidden>
      <h2>Videos on this page</h2>
      <ul id="video-list"></ul>
    </section>
    <div class="row">
      <button id="pause" type="button">Pause all</button>
      <button id="resume" type="button">Resume all</button>
    </div>
    <button id="open" type="button" class="primary">Open ODM</button>
    <script src="popup.js"></script>
  </body>
</html>
